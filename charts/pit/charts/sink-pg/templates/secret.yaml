{{- if not .Values.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sink-pg.fullname" . }}
  labels:
    {{- include "sink-pg.labels" . | nindent 4 }}
type: Opaque
stringData:
  # One key, not two. There is no replication role here: nothing decodes this
  # database's WAL, so it needs no second credential.
  postgres-password: {{ .Values.auth.password | quote }}
{{- end }}
