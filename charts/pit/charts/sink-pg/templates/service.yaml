apiVersion: v1
kind: Service
metadata:
  name: {{ include "sink-pg.fullname" . }}-headless
  labels:
    {{- include "sink-pg.labels" . | nindent 4 }}
spec:
  # Required by the StatefulSet for stable per-pod DNS.
  clusterIP: None
  ports:
    - name: postgresql
      port: {{ .Values.service.port }}
      targetPort: postgresql
  selector:
    {{- include "sink-pg.selectorLabels" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sink-pg.fullname" . }}
  labels:
    {{- include "sink-pg.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: postgresql
      port: {{ .Values.service.port }}
      targetPort: postgresql
      protocol: TCP
  selector:
    {{- include "sink-pg.selectorLabels" . | nindent 4 }}
