{{- if .Values.extraInitScripts }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sink-pg.fullname" . }}-initdb
  labels:
    {{- include "sink-pg.labels" . | nindent 4 }}
data:
  {{- range $name, $content := .Values.extraInitScripts }}
  {{ $name }}: |
    {{- $content | nindent 4 }}
  {{- end }}
{{- end }}
