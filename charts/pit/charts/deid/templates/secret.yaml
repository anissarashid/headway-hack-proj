{{- /*
The HMAC salt.

Every surrogate in every clean topic descends from it, and a stable surrogate is
the only reason joins survive de-identification -- so rotating this rewrites
every token in every topic, and two pipelines with different salts produce
replicas that cannot be joined to each other.

A Kubernetes Secret is base64, not encryption: anyone who can read the Secret can
read the salt, and anyone who has the salt can re-identify a token by guessing
its input. That is acceptable here because the source data is synthetic. Anywhere
shared, set `salt.existingSecret` to a Secret populated from a real secret
manager, and this template renders nothing.
*/ -}}
{{- if not .Values.salt.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "deid.fullname" . }}
  labels:
    {{- include "deid.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.salt.key }}: {{ required "deid.salt.value is required unless salt.existingSecret is set" .Values.salt.value | quote }}
{{- end }}
