apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "source-pg.fullname" . }}-conf
  labels:
    {{- include "source-pg.labels" . | nindent 4 }}
data:
  postgresql.conf: |
    # Rendered by the source-pg chart. Passed to postgres as -c config_file=...
    # so it fully replaces the postgresql.conf initdb writes into PGDATA. That
    # means the three file paths below are mandatory: without them postgres
    # looks for the data directory next to this file and fails to start.
    data_directory = '{{ .Values.pgData }}'
    hba_file = '{{ .Values.pgData }}/pg_hba.conf'
    ident_file = '{{ .Values.pgData }}/pg_ident.conf'

    listen_addresses = '*'
    port = {{ .Values.service.port }}

    # ---- logical decoding (DATA-699) ----
    # Debezium reads changes through a logical replication slot. Without
    # wal_level=logical the WAL carries no row images to decode and slot
    # creation fails outright, so there is no CDC and nothing downstream.
    wal_level = {{ .Values.logicalDecoding.walLevel }}
    max_replication_slots = {{ .Values.logicalDecoding.maxReplicationSlots }}
    max_wal_senders = {{ .Values.logicalDecoding.maxWalSenders }}
    {{- with .Values.logicalDecoding.walKeepSize }}
    wal_keep_size = {{ . }}
    {{- end }}
    {{- with .Values.extraPostgresqlConf }}

    # ---- extraPostgresqlConf ----
    {{- . | nindent 4 }}
    {{- end }}
