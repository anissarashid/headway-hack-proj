image:
  repository: postgres
  tag: "16.10"
  pullPolicy: IfNotPresent

# The official image runs as uid/gid 999. fsGroup makes the PVC writable by it.
podSecurityContext:
  fsGroup: 999
containerSecurityContext:
  runAsUser: 999
  runAsGroup: 999
  allowPrivilegeEscalation: false

auth:
  database: pit
  username: pit
  # Dev-only defaults. Set auth.existingSecret to supply real credentials.
  password: pit-dev-password
  # Role Debezium connects as. LOGIN + REPLICATION is what opening a slot needs.
  replicationUsername: debezium
  replicationPassword: debezium-dev-password
  # The chart creates the publication (see replication.publication), so the
  # connector does not need superuser for normal operation. It is granted
  # anyway, so that a connector pointed at a publication name nobody created can
  # still create it -- the database never needs manual attention. Turn this off
  # on a shared cluster and the role falls back to REPLICATION + SELECT.
  replicationSuperuser: true
  # Secret with keys `postgres-password` and `replication-password`.
  existingSecret: ""

# PGDATA is a subdirectory of the mount, not the mount root — the official image
# recommends this so initdb never has to contend with a non-empty volume root.
dataDir: /var/lib/postgresql/data
pgData: /var/lib/postgresql/data/pgdata
postgresqlConfDir: /etc/postgresql

# The reason this chart exists. wal_level=logical cannot be changed without a
# restart, so it is baked into postgresql.conf rather than set via ALTER SYSTEM.
logicalDecoding:
  walLevel: logical
  maxReplicationSlots: 4
  maxWalSenders: 4
  # Retain enough WAL that a briefly-disconnected connector can catch up.
  walKeepSize: 512MB

# Full replication by default, rather than a table opting in.
#
# Postgres has no GUC for replica identity and no way to say "publish whatever
# exists". Both halves are manufactured in SQL: files/replication/ installs an
# event trigger so a new table gets complete before images, and the publication
# is FOR ALL TABLES so a new table joins the stream. Neither needs a table list.
replication:
  # REPLICA IDENTITY FULL on every table, including tables created later. Off
  # leaves the primary-key default, and an UPDATE then reaches the WAL carrying
  # only the key columns -- no before image for anything downstream to use.
  fullReplicaIdentity: true
  publication:
    # Created at init so Debezium needs no prior setup. Off means the connector
    # creates its own, which needs auth.replicationSuperuser.
    create: true
    # Debezium's own default, so the connector works without overriding it.
    name: dbz_publication

# Appended verbatim to postgresql.conf. Anything not CDC-critical goes here.
extraPostgresqlConf: |
  max_connections = 100
  shared_buffers = 128MB
  dynamic_shared_memory_type = posix
  log_timezone = 'Etc/UTC'
  timezone = 'Etc/UTC'
  log_line_prefix = '%m [%p] %q%u@%d '
  datestyle = 'iso, mdy'
  default_text_search_config = 'pg_catalog.english'

# The clinic schema, from files/initdb/*.sql. Off gives you a bare Postgres with
# logical decoding and nothing to decode; the rest of the pipeline assumes on.
# Replication config is deliberately not behind this gate -- see replication.
clinicSchema:
  enabled: true

# Extra files dropped into /docker-entrypoint-initdb.d, keyed by filename.
# Sorted lexically by the entrypoint, so prefix with a number. The chart owns
# 10- (role), 11- (replica identity), 12- (publication) and 20- (schema);
# anything else should use 30- and up.
extraInitScripts: {}

service:
  type: ClusterIP
  port: 5432

persistence:
  enabled: true
  size: 8Gi
  storageClass: ""
  accessModes:
    - ReadWriteOnce

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 1Gi

nodeSelector: {}
tolerations: []
affinity: {}
