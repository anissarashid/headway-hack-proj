# Umbrella defaults — invariants that hold in every environment.
# Laptop sizing (single broker, TLS off, small resources) lives in
# values-local.yaml and is layered on top with `-f values-local.yaml`.
# Per-subchart overrides live under the subchart's name.

redpanda:
  # Stable in-cluster hostnames. M3's Debezium connector and the deid/applier
  # services address the broker + registry as `pit-redpanda:{9093,8081}`, so
  # pin the name rather than let it derive from the release name.
  fullnameOverride: pit-redpanda

  # Schema registry is built into the broker on :8081 (not a separate service).
  # This is the contract the whole project rests on, so assert it explicitly
  # even though the chart default already enables it.
  listeners:
    schemaRegistry:
      enabled: true
      port: 8081

  # Redpanda Console. The chart auto-wires its config to this broker's Kafka,
  # schema-registry and admin APIs when enabled. Serves on :8080.
  console:
    enabled: true
    fullnameOverride: pit-console

# The CDC source. Its own defaults live in charts/source-pg/values.yaml; only
# the dependency gate belongs here. Read by the umbrella NOTES.txt, so this key
# must exist even when disabled.
source-pg:
  enabled: true
  # M3/CDC: create the Debezium publication as the superuser at init, so the
  # least-privilege `debezium` role never needs CREATE on the database, and
  # grant it the SELECT the initial snapshot reads with. Runs after 20-schema.
  extraInitScripts:
    30-cdc-publication.sql: |
      CREATE PUBLICATION pit_publication FOR TABLE
        public.patients, public.providers, public.appointments,
        public.claims, public.notes;
      GRANT USAGE ON SCHEMA public TO debezium;
      GRANT SELECT ON ALL TABLES IN SCHEMA public TO debezium;
      ALTER DEFAULT PRIVILEGES IN SCHEMA public
        GRANT SELECT ON TABLES TO debezium;

# The Debezium Avro CDC source (M3). Reads the source-pg tables and writes Avro
# to raw.* topics with schemas in Redpanda's registry. Needs the locally-built
# pit/connect:dev image loaded into the cluster — `make up` builds and loads it.
connect:
  enabled: true

# Subcharts filled in by later milestones. Off until their milestone lands, so a
# stray template cannot deploy before the milestone that owns it.
# Each block is still present so environment overrides have a stable path.
deid:
  enabled: false
sink-pg:
  enabled: false
pitctl:
  enabled: false
