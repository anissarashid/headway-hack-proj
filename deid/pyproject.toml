[project]
name = "deid"
version = "0.1.0"
description = "De-identification transformer: raw.* topics -> clean.* topics"
requires-python = ">=3.11"

# PyYAML only, for now. The policy parser is the edge of the system and has no
# business reaching a broker or a database, so it stays dependency-light and its
# tests run with no cluster.
dependencies = [
  "PyYAML>=6.0,<7",
]

[dependency-groups]
dev = ["pytest>=8.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deid"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
