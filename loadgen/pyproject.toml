[project]
name = "loadgen"
version = "0.1.0"
description = "Deterministic synthetic load generator for the PIT clinic schema"
requires-python = ">=3.11"

# Faker is pinned exactly, not floored. The seed guarantees the same draws from
# the same generator; it says nothing about a new Faker release changing what
# first_name() returns for a given draw. An unpinned Faker would move the
# fingerprint between machines and make the determinism check meaningless.
dependencies = [
  "Faker==37.4.0",
  "psycopg[binary]>=3.2,<4",
]

[project.scripts]
loadgen-seed = "loadgen.seed:main"

[dependency-groups]
dev = ["pytest>=8.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loadgen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
